<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homely</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <img src="assets/images/logo.svg" alt="logo">
            <nav>
                <menu>
                    <ul>
                        <li><a href="#">Homepage</a></li>
                        <li><a href="#">Mega Menu</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Rooms</a></li>
                        <li><a href="#">Services</a></li>
                        <li><a href="#">Pages <i class="ri-arrow-down-s-line"></i></a></li>
                    </ul>
                </menu>
            </nav>
            <div class="btns">
                <button class="login-bt">Log in</button>
                <button class="contacts-bt">Contacts</button>
            </div>
        </header>
        <section class="hero-section">
            <div class="hero-left">
                <div class="ratings">
                    <button class="rating-content">
                        <i class="ri-star-fill"></i>
                        <div class="rating-text-content">
                            <h3>
                                4.5 Rating
                            </h3>
                            <h4>by New York Times</h4>
                        </div>
                    </button>
                </div>

                <h1>Find out the Best stay.
                </h1>
                <p>Your content goes here. Edit or remove this text inline or in the <span>module Content
                        settings.</span> You can also style every
                    aspect of this content in the <span>module Design</span></p>
                <div class="btns">
                    <button class="login-bt">Log in</button>
                    <button class="getstarted-bt"><i class="ri-arrow-right-line"></i>Get Started</button>
                </div>
                <h4 class="trustedby-lbl">Trusted by</h4>
                <div class="partners">
                    <img src="assets/images/airbnb.svg" alt="airbng">
                    <img src="assets/images/emirates.svg" alt="emirates">
                    <img src="assets/images/united-travel.svg" alt="united travel">
                    <img src="assets/images/samsonite.svg" alt="samsonite">
                </div>
            </div>
            <div class="hero-right">
                <img src="assets/hero-right-img.jpg" alt="hero-img">
            </div>
        </section>
    </main>
</body>


</html>
